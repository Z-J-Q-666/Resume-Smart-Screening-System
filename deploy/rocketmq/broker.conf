# RocketMQ Broker（容器内使用）

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：注册到 NameServer 的地址必须是 compose 网络内可解析的名字，
# 不能留默认的容器 IP（重启会变，backend 就连不上了）。
brokerIP1 = rocketmq-broker

# 简化部署：topic 不存在时自动创建。
# 生产环境应该关掉，改成启动时用 mqadmin updateTopic 显式建。
autoCreateTopicEnable = true
