server:
  port: 8080
  tomcat:
    max-http-form-post-size: 12MB

spring:
  application:
    name: resume-screening
  datasource:
    # 环境变量优先，本地开发走默认值。容器部署由 docker-compose 注入，
    # 这里的 ${} 是显式引用而不是依赖 Spring 的 relaxed binding——
    # app.ai.base-url 这种带连字符的键在环境变量里映射规则容易踩坑，写死更稳。
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/resume_screening?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

app:
  # 文件存储根目录，相对路径基于 backend 工程根；容器里挂卷到 /data/uploads
  upload-dir: ${UPLOAD_DIR:./uploads}
  # Python AI 服务
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 90000
    # 必须与 ai-service/app/match_chain.py 的 PROMPT_VERSION 一致，
    # 它参与语义分缓存的 key。不一致时缓存会一直未命中（只浪费调用，不会算错分），
    # 启动时会比对 /health 并打 WARN。
    match-prompt-version: v3
    # 成本估算单价（元 / 百万 token）。改价只改这两行，别散落到代码里。
    price-prompt-per-million: 2.0
    price-completion-per-million: 8.0
  # RocketMQ
  mq:
    namesrv-addr: ${MQ_NAMESRV:127.0.0.1:9876}
    producer-group: resume-screening-producer
    extract-topic: resume-extract
    extract-consumer-group: resume-extract-consumer-group
    match-topic: match-score
    match-consumer-group: match-score-consumer-group
    consume-threads: 2
    max-reconsume-times: 3
    # 启动时若 MQ 不可用是否阻断启动：false = 降级为同步直连 AI
    enabled: true
  # 上传限流：每用户每分钟请求数
  rate-limit:
    upload-per-minute: 20
  # 语义分 / 规则分权重
  score:
    rule-weight: 0.6
    semantic-weight: 0.4
    # 语义分分组阈值：榜单先分组、组内再按综合分排。
    # 语义分回答"方向对不对"，规则分回答"这个人够不够"，两者不该混成一个排序键。
    match-high-threshold: 70
    match-partial-threshold: 50

logging:
  level:
    root: INFO
    com.resume.screening: INFO
    org.apache.rocketmq: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
